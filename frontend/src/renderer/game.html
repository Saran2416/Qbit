<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Qbit arcade</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/game.css" />
  </head>
  <body class="game">
    <div class="game-card">
      <header class="game-head">
        <span class="game-title" id="game-title">Qbit arcade</span>
        <button id="game-close" class="icon-btn" title="Close (Esc)">×</button>
      </header>
      <main id="view" class="game-view"></main>
      <footer class="game-foot">
        <span id="game-hint">pick a game</span>
      </footer>
    </div>
    <script type="module" src="./game/main.ts"></script>
  </body>
</html>
